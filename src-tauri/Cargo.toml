[package]
name = "peppi"
version = "1.0.3"
description = "Headless recording for SSBM through Slippi/Dolphin plus cloud storage"
authors = ["hatsupatsu"]
edition = "2021"

[lib]
name = "peppi_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "devtools"] }
tauri-plugin-log = { version = "2" }
tauri-plugin-store = { version = "2" }
tauri-plugin-dialog = { version = "2" }
tauri-plugin-fs = { version = "2" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
notify = "7.0"
thiserror = "2.0"
chrono = "0.4"
log = "0.4"
sysinfo = "0.31"
base64 = "0.22"
png = "0.17"
walkdir = "2"
# Device ID generation only
uuid = { version = "1.11", features = ["v4", "serde"] }
# FFmpeg for clip extraction
ffmpeg-sidecar = "2.0"
# SQLite for persistent metadata cache
rusqlite = { version = "0.32", features = ["bundled"] }
tauri-plugin-updater = "2.9.0"
tauri-plugin-process = "2.3.1"
# OBS websocket client
obws = "0.15"
# HTTP client for downloading OBS installer
reqwest = { version = "0.12", features = ["rustls-tls"], default-features = false }
# App data directories
dirs = "6"
tauri-plugin-global-shortcut = "2.3.1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_HiDpi",
    "Win32_System_Threading",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Storage_Xps",
] }
# Windows registry access (find OBS install path)
winreg = "0.55"
