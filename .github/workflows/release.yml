# Release: bumps version, builds signed Windows MSI + macOS DMG, uploads to GitHub Release.
# Optional: signs update bundle and uploads to R2 for in-app updater.
# Required secrets: TAURI_SIGNING_PRIVATE_KEY, TAURI_SIGNING_PRIVATE_KEY_PASSWORD (contents of your .key file and its password).
# Optional R2 (for auto-updater): R2_ACCOUNT_ID, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY, R2_BUCKET_NAME, R2_PUBLIC_URL (e.g. https://pub-xxx.r2.dev).
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v1.0.0). Leave empty to auto-increment from latest tag.'
        required: false
        type: string

permissions:
  contents: write
  pull-requests: read

jobs:
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      version_raw: ${{ steps.version.outputs.version_raw }}
      release_id: ${{ steps.release.outputs.id }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version
        id: version
        run: |
          if [ -z "${{ github.event.inputs.version }}" ]; then
            # Get latest tag
            LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
            echo "Latest tag: $LATEST_TAG"
            
            # Remove 'v' prefix if present
            VERSION=${LATEST_TAG#v}
            
            # Increment patch version
            IFS='.' read -r -a VERSION_PARTS <<< "$VERSION"
            MAJOR=${VERSION_PARTS[0]:-0}
            MINOR=${VERSION_PARTS[1]:-0}
            PATCH=${VERSION_PARTS[2]:-0}
            
            PATCH=$((PATCH + 1))
            NEW_VERSION="v${MAJOR}.${MINOR}.${PATCH}"
          else
            NEW_VERSION="${{ github.event.inputs.version }}"
            # Ensure version starts with 'v'
            if [[ ! "$NEW_VERSION" =~ ^v ]]; then
              NEW_VERSION="v${NEW_VERSION}"
            fi
          fi
          
          NEW_VERSION_RAW="${NEW_VERSION#v}"
          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "version_raw=$NEW_VERSION_RAW" >> $GITHUB_OUTPUT
          echo "Creating release for version: $NEW_VERSION"

      - name: Create GitHub Release
        id: release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: Release ${{ steps.version.outputs.version }}
          body: |
            Release ${{ steps.version.outputs.version }}
            
            ## Downloads
            - **Windows (x64)**: `Peppi_${{ steps.version.outputs.version }}_x64-setup.exe`
            - **macOS (Apple Silicon)**: `Peppi_${{ steps.version.outputs.version }}_aarch64.dmg`
            
            ## Features
            - 🎥 Screen recording with platform-optimized libraries
            - 📁 Slippi replay folder monitoring
            - 🪟 Windows: No yellow border recording
            - 🍎 macOS: Optimized for M1/M2/M3 chips
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-windows:
    name: Build Windows
    needs: create-release
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lockb') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install

      - name: Set version in project files
        run: |
          $version = "${{ needs.create-release.outputs.version_raw }}"
          (Get-Content src-tauri/tauri.conf.json -Raw) -replace '"version":\s*"[^"]*"', "`"version`": `"$version`"" | Set-Content src-tauri/tauri.conf.json -NoNewline
          (Get-Content package.json -Raw) -replace '"version":\s*"[^"]*"', "`"version`": `"$version`"" | Set-Content package.json -NoNewline
        shell: pwsh

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true

      - name: Install Tauri CLI
        run: bun install -g @tauri-apps/cli@latest

      - name: Build frontend
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_CLIPS_CDN_URL: ${{ secrets.VITE_CLIPS_CDN_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: bun run build

      - name: Build Tauri app (Windows)
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_CLIPS_CDN_URL: ${{ secrets.VITE_CLIPS_CDN_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: bunx tauri build --target x86_64-pc-windows-msvc -- --features real-recording

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: |
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
          retention-days: 30

  windows-updater:
    name: Sign & publish updater (Windows)
    needs: [create-release, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows MSI
        uses: actions/download-artifact@v4
        with:
          name: windows-exe
          path: ./windows-artifacts

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Zip and sign MSI for updater
        id: sign
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          VERSION="${{ needs.create-release.outputs.version_raw }}"
          MSI="windows-artifacts/Peppi_${VERSION}_x64_en-US.msi"
          if [ ! -f "$MSI" ]; then
            MSI=$(ls windows-artifacts/*.msi 2>/dev/null | head -1)
          fi
          if [ -z "$MSI" ] || [ ! -f "$MSI" ]; then
            echo "No MSI found" && exit 1
          fi
          zip -j "Peppi_${VERSION}_x64_en-US.msi.zip" "$MSI"
          bunx tauri signer sign --private-key "$TAURI_SIGNING_PRIVATE_KEY" --password "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" "Peppi_${VERSION}_x64_en-US.msi.zip"
          SIGNATURE=$(cat "Peppi_${VERSION}_x64_en-US.msi.zip.sig" | tr -d '\n')
          echo "signature=$SIGNATURE" >> $GITHUB_OUTPUT
          echo "msi_zip=Peppi_${VERSION}_x64_en-US.msi.zip" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Generate latest.json
        id: latest
        env:
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
        run: |
          VERSION="${{ steps.sign.outputs.version }}"
          SIGNATURE="${{ steps.sign.outputs.signature }}"
          PUB_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          BASE_URL="${R2_PUBLIC_URL:-https://pub-a7a1511ed0f84ebbb1afa93d4fe41cb6.r2.dev}"
          URL="${BASE_URL%/}/msi/Peppi_${VERSION}_x64_en-US.msi.zip"
          echo '{"version":"'"$VERSION"'","notes":"See GitHub release","pub_date":"'"$PUB_DATE"'","platforms":{"windows-x86_64":{"signature":"'"$SIGNATURE"'","url":"'"$URL"'"}}}' > latest.json
          cat latest.json

      - name: Upload to R2 (S3-compatible)
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: |
          if [ -z "$R2_ACCESS_KEY_ID" ]; then
            echo "R2 secrets not set, skipping upload (latest.json is in artifacts)"
            exit 0
          fi
          pip install awscli
          export AWS_ACCESS_KEY_ID="$R2_ACCESS_KEY_ID"
          export AWS_SECRET_ACCESS_KEY="$R2_SECRET_ACCESS_KEY"
          export AWS_DEFAULT_REGION=auto
          aws s3 cp "${{ steps.sign.outputs.msi_zip }}" "s3://$R2_BUCKET_NAME/msi/${{ steps.sign.outputs.msi_zip }}" \
            --endpoint-url "https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com"
          aws s3 cp latest.json "s3://$R2_BUCKET_NAME/latest.json" \
            --endpoint-url "https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com" \
            --content-type "application/json"
        continue-on-error: true

      - name: Upload latest.json artifact
        uses: actions/upload-artifact@v4
        with:
          name: updater-latest
          path: latest.json
          retention-days: 90

  build-macos:
    name: Build macOS
    needs: create-release
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lockb') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          # Build for Apple Silicon (most modern Macs)
          targets: aarch64-apple-darwin
          # Uncomment to also build for Intel Macs (slower):
          # targets: x86_64-apple-darwin,aarch64-apple-darwin

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true

      - name: Install Tauri CLI
        run: bun install -g @tauri-apps/cli@latest

      - name: Build frontend
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_CLIPS_CDN_URL: ${{ secrets.VITE_CLIPS_CDN_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: bun run build

      - name: Build Tauri app (macOS)
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_CLIPS_CDN_URL: ${{ secrets.VITE_CLIPS_CDN_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        # env:
        #   # Placeholder for macOS code signing (uncomment when ready)
        #   # APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
        #   # APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        #   # APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        #   # APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # Uncomment when code signing is configured:
          # security create-keychain -p "$APPLE_CERTIFICATE_PASSWORD" build.keychain
          # security default-keychain -s build.keychain
          # security unlock-keychain -p "$APPLE_CERTIFICATE_PASSWORD" build.keychain
          # security import <(echo "$APPLE_CERTIFICATE" | base64 -d) -k build.keychain -T /usr/bin/codesign -T /usr/bin/security
          # security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$APPLE_CERTIFICATE_PASSWORD" build.keychain
          bunx tauri build --target aarch64-apple-darwin -- --features real-recording

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          retention-days: 30

  upload-release:
    name: Upload to Release
    needs: [create-release, build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-exe
          path: ./artifacts/windows

      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: macos-dmg
          path: ./artifacts/macos

      - name: Upload artifacts to Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            ./artifacts/windows/**/*
            ./artifacts/macos/**/*
          tag_name: ${{ needs.create-release.outputs.version }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

